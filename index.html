<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Term Countdown</title>

    <!-- Excel reader -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        .upload-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        select,
        input {
            margin: 10px;
            padding: 10px;
        }

        .next-event {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            text-align: center;
        }

        .next-event h2 {
            margin-top: 0;
        }

        .countdown {
            font-size: 32px;
            font-weight: bold;
            margin: 15px 0;
        }

        .event {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .event-date {
            font-weight: bold;
        }

        #status {
            text-align: center;
            margin: 15px;
        }
    </style>
</head>

<body>

    <h1>Term Countdown</h1>

    <div class="upload-box">

        <p>
            Upload your school calendar to see upcoming events and countdowns.
        </p>

        <input type="file" id="fileInput" accept=".xlsx,.xls">

        <br>

        <label for="sheetSelect">Calendar:</label>

        <select id="sheetSelect" disabled>
            <option>Select a calendar</option>
        </select>

    </div>

    <div id="status">
        No calendar uploaded yet.
    </div>

    <div id="nextEvent"></div>

    <h2>Upcoming Events</h2>

    <div id="events"></div>


    <script>

        let allEvents = [];
        let selectedEvent = null;


        // Read the uploaded Excel file
        document.getElementById("fileInput").addEventListener("change", function(event) {

            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                try {

                    const data = new Uint8Array(e.target.result);

                    const workbook = XLSX.read(data, {
                        type: "array",
                        cellDates: true
                    });

                    const sheetSelect = document.getElementById("sheetSelect");

                    sheetSelect.innerHTML = "";

                    // Only show the 2026 Primary and Secondary calendars
                    const usefulSheets = workbook.SheetNames.filter(sheetName =>
                        sheetName === "2026-Primary" ||
                        sheetName === "2026-Secondary"
                    );

                    if (usefulSheets.length === 0) {

                        document.getElementById("status").textContent =
                            "Could not find the 2026 Primary or Secondary calendar.";

                        return;
                    }

                    usefulSheets.forEach(sheetName => {

                        const option = document.createElement("option");

                        option.value = sheetName;
                        option.textContent =
                            sheetName === "2026-Primary"
                                ? "2026 - Primary"
                                : "2026 - Secondary";

                        sheetSelect.appendChild(option);

                    });

                    sheetSelect.disabled = false;

                    // Load the first available calendar
                    loadCalendar(workbook, usefulSheets[0]);

                    // Change calendar when dropdown changes
                    sheetSelect.onchange = function() {
                        loadCalendar(workbook, this.value);
                    };

                } catch (error) {

                    console.error(error);

                    document.getElementById("status").textContent =
                        "There was a problem reading the Excel file.";

                }

            };

            reader.readAsArrayBuffer(file);

        });


        // Extract events from the calendar
        function loadCalendar(workbook, sheetName) {

            const worksheet = workbook.Sheets[sheetName];

            const range = XLSX.utils.decode_range(worksheet["!ref"]);

            allEvents = [];

            /*
                Your spreadsheet is arranged like this:

                Month 1:
                Day | Date | Event

                Month 2:
                Day | Date | Event

                Month 3:
                Day | Date | Event

                etc.
            */

            // 12 months × 3 columns
            for (let month = 0; month < 12; month++) {

                const dayColumn = month * 3;
                const dateColumn = dayColumn + 1;
                const eventColumn = dayColumn + 2;

                // Start at row 3 because rows 1 and 2 contain headings
                for (let row = 2; row <= range.e.r; row++) {

                    const dayCell =
                        worksheet[XLSX.utils.encode_cell({
                            r: row,
                            c: dayColumn
                        })];

                    const dateCell =
                        worksheet[XLSX.utils.encode_cell({
                            r: row,
                            c: dateColumn
                        })];

                    const eventCell =
                        worksheet[XLSX.utils.encode_cell({
                            r: row,
                            c: eventColumn
                        })];


                    if (!dateCell || !dateCell.v) {
                        continue;
                    }


                    const dayNumber = Number(dateCell.v);

                    if (
                        isNaN(dayNumber) ||
                        dayNumber < 1 ||
                        dayNumber > 31
                    ) {
                        continue;
                    }


                    let eventText = "";

                    if (eventCell && eventCell.v) {
                        eventText = String(eventCell.v).trim();
                    }


                    // Ignore days without events
                    if (!eventText) {
                        continue;
                    }


                    const date = new Date(
                        2026,
                        month,
                        dayNumber
                    );


                    allEvents.push({
                        name: eventText,
                        date: date
                    });

                }

            }


            // Sort events by date
            allEvents.sort((a, b) => a.date - b.date);


            document.getElementById("status").textContent =
                `${allEvents.length} events found in ${sheetName}.`;


            displayEvents();

        }


        // Find upcoming events
        function displayEvents() {

            const now = new Date();

            const upcomingEvents = allEvents.filter(event => {
                return event.date >= new Date(
                    now.getFullYear(),
                    now.getMonth(),
                    now.getDate()
                );
            });


            const nextEventBox =
                document.getElementById("nextEvent");

            const eventsBox =
                document.getElementById("events");


            eventsBox.innerHTML = "";


            if (upcomingEvents.length === 0) {

                nextEventBox.innerHTML = `
                    <div class="next-event">
                        <h2>No upcoming events</h2>
                    </div>
                `;

                return;
            }


            selectedEvent = upcomingEvents[0];


            // Next event
            nextEventBox.innerHTML = `
                <div class="next-event">

                    <h2>Next Event</h2>

                    <h3>${selectedEvent.name}</h3>

                    <p>
                        ${formatDate(selectedEvent.date)}
                    </p>

                    <div class="countdown" id="countdown">
                        Calculating...
                    </div>

                </div>
            `;


            // Display upcoming events
            upcomingEvents.slice(0, 20).forEach(event => {

                const eventElement =
                    document.createElement("div");

                eventElement.className = "event";

                eventElement.innerHTML = `

                    <div class="event-date">
                        ${formatDate(event.date)}
                    </div>

                    <div>
                        ${event.name.replace(/\n/g, "<br>")}
                    </div>

                `;

                eventsBox.appendChild(eventElement);

            });


            updateCountdown();

        }


        // Format dates
        function formatDate(date) {

            return date.toLocaleDateString("en-GB", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

        }


        // Countdown timer
        function updateCountdown() {

            if (!selectedEvent) {
                return;
            }


            const now = new Date();

            const difference =
                selectedEvent.date - now;


            const countdown =
                document.getElementById("countdown");


            if (!countdown) {
                return;
            }


            if (difference <= 0) {

                countdown.textContent = "Today";

                return;
            }


            const days =
                Math.floor(
                    difference / (1000 * 60 * 60 * 24)
                );


            const hours =
                Math.floor(
                    (difference / (1000 * 60 * 60)) % 24
                );


            const minutes =
                Math.floor(
                    (difference / (1000 * 60)) % 60
                );


            const seconds =
                Math.floor(
                    (difference / 1000) % 60
                );


            countdown.textContent =
                `${days}d ${hours}h ${minutes}m ${seconds}s`;

        }


        // Update countdown every second
        setInterval(updateCountdown, 1000);

    </script>

</body>

</html>
